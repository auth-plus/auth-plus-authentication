service:
  env: development
  secret: local_secret_key_change_me

site:
  url: http://localhost:14318

listen:
  http:
    addr: :80
  grpc:
    addr: :4317

self_monitoring:
  disabled: true

ch_cluster:
  shards:
    - replicas:
        - addr: clickhouse:9000
          database: uptrace
          user: uptrace
          password: uptrace
          max_execution_time: 15s

pg:
  addr: database:5432
  user: root
  password: db_password
  database: auth

redis_cache:
  addrs:
    1: cache:6379

seed_data:
  users:
    - key: user1
      name: Admin
      email: admin@uptrace.local
      password: admin
      email_confirmed: true
  user_tokens:
    - key: user_token1
      user_key: user1
      token: admin_secret_token
  orgs:
    - key: org1
      name: Org1
  org_users:
    - key: org_user1
      org_key: org1
      user_key: user1
      role: owner
  projects:
    - key: project1
      name: Project1
      org_key: org1
  project_tokens:
    - key: project_token1
      project_key: project1
      token: local_development_secret_token
  project_users:
    - key: project_user1
      project_key: project1
      org_user_key: org_user1
      perm_level: admin